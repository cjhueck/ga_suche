<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GA-Suche Mitgliederbereich</title>
  <link rel="stylesheet" href="members-panel.css">
  <style>
    /* ===== Design im Stil der GA-Suche ===== */
    :root {
      --text-color: #333333;
      --heading-color: #467886;
      --link-color: #467886;
      --accent-color: #467886;
      --background-color: #FAF8F3;
      --border-color: #ddd;
      --secondary-text: #666;
      --success-color: #4CAF50;
      --error-color: #f44336;
      --warning-color: #ff9800;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: white;
      border-bottom: 2px solid var(--accent-color);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      color: var(--heading-color);
      font-size: 1.8rem;
      font-weight: normal;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      border-radius: 4px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-button:hover {
      background-color: #3a6270;
    }

    .back-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .user-email {
      color: var(--secondary-text);
      font-size: 0.9rem;
    }

    button.secondary {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    button.secondary:hover {
      background-color: var(--accent-color);
      color: white;
    }

    /* Toolbar */
    .toolbar {
      background: white;
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .toolbar-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .toolbar-tab {
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.9rem;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .toolbar-tab:hover {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .toolbar-tab.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .toolbar-spacer {
      flex: 1;
    }

    .toolbar-select {
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-family: inherit;
      background: white;
      border-radius: 4px;
    }

    .toolbar-btn {
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.9rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .toolbar-btn:hover {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .toolbar-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left Column: BM/Z List */
    .items-column {
      width: 50%;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .items-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .item-card {
      background: white;
      border: 1px solid var(--border-color);
      padding: 1rem;
      margin-bottom: 1rem;
      cursor: move;
      transition: all 0.2s;
      position: relative;
    }

    .item-card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .item-card.selected {
      border-color: var(--accent-color);
      border-width: 2px;
      background: #f0f8ff;
    }

    .item-card.dragging {
      opacity: 0.5;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .item-ga {
      color: var(--accent-color);
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .item-ga:hover {
      text-decoration: underline;
    }

    .item-date {
      color: var(--secondary-text);
      font-size: 0.85rem;
    }

    .item-text {
      font-style: italic;
      color: var(--text-color);
      margin: 0.5rem 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .item-tag {
      background: transparent;
      color: var(--link-color);
      border: 1px solid var(--link-color);
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 3px;
    }

    /* Right Column: Notes */
    .notes-column {
      width: 50%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      background: white;
    }

    .notes-header h3 {
      color: var(--heading-color);
      font-size: 1.1rem;
      font-weight: normal;
    }

    .notes-content {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    .notes-textarea {
      width: 100%;
      height: 100%;
      min-height: 300px;
      padding: 1rem;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      background: white;
    }

    .notes-textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .notes-empty {
      text-align: center;
      color: var(--secondary-text);
      padding: 3rem;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--secondary-text);
    }

    /* Auth View */
    #auth-view {
      display: none;
      max-width: 500px;
      margin: 4rem auto;
    }

    #auth-view.active {
      display: block;
    }

    .auth-card {
      background: white;
      padding: 3rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .auth-card h2 {
      color: var(--heading-color);
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--heading-color);
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      font-family: inherit;
      background: white;
    }

    button[type="submit"] {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
    }

    button[type="submit"]:hover {
      background-color: #3a6270;
    }

    .auth-switch {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--secondary-text);
    }

    .auth-switch a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 600;
    }

    .message {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #app-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    #app-view.active {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Auth View -->
  <div id="auth-view">
    <div class="auth-card">
      <h2 id="auth-title">Mitglieder Login</h2>
      
      <div id="auth-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-Mail</label>
          <input type="email" id="login-email" required>
        </div>
        
        <div class="form-group">
          <label for="login-password">Passwort</label>
          <input type="password" id="login-password" required>
        </div>
        
        <button type="submit">Anmelden</button>
      </form>

      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label for="register-name">Anzeigename</label>
          <input type="text" id="register-name" required>
        </div>
        
        <div class="form-group">
          <label for="register-email">E-Mail</label>
          <input type="email" id="register-email" required>
        </div>
        
        <div class="form-group">
          <label for="register-password">Passwort (mind. 6 Zeichen)</label>
          <input type="password" id="register-password" minlength="6" required>
        </div>
        
        <button type="submit">Registrieren</button>
      </form>

      <div class="auth-switch">
        <span id="auth-switch-text">Noch kein Account?</span>
        <a href="#" id="auth-switch-link">Jetzt registrieren</a>
      </div>

      <div class="auth-switch" style="margin-top: 1rem;">
        <a href="app.html">← Zurück zur Startseite</a>
      </div>
    </div>
  </div>

  <!-- Main App View -->
  <div id="app-view">
    <header>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="back-button" id="back-to-app-btn" title="Zurück zu app.html" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Zurück
        </button>
        <h1>GA-Suche Mitgliederbereich</h1>
      </div>
      <div class="user-info">
        <span class="user-email" id="user-email"></span>
        <button class="secondary" id="logout-btn">Abmelden</button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-tabs">
        <button class="toolbar-tab active" data-tab="bookmarks">Bookmarks</button>
        <button class="toolbar-tab" data-tab="quotes">Zitate</button>
      </div>
      
      <div class="toolbar-spacer"></div>
      
      <select id="keyword-filter" class="toolbar-select">
        <option value="">Schlagwörter</option>
      </select>
      
      <button class="toolbar-btn" id="sort-btn" title="Nach Datum sortieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M7 12h10M11 18h6"></path>
        </svg>
      </button>
      
      <button class="toolbar-btn" id="delete-btn" title="Mehrere löschen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
      </button>
      
      <button class="toolbar-btn" data-tab="chat">Chat</button>
    </div>

    <!-- Main Content: Two Columns -->
    <div class="main-content">
      <!-- Left: Items List -->
      <div class="items-column">
        <div class="items-list" id="items-list">
          <div class="empty-state">Lade Daten...</div>
        </div>
      </div>

      <!-- Right: Notes -->
      <div class="notes-column">
        <div class="notes-header">
          <h3 id="notes-title">Notizen</h3>
        </div>
        <div class="notes-content">
          <div class="notes-empty" id="notes-empty">
            Wählen Sie ein Bookmark oder Zitat aus, um Notizen zu bearbeiten
          </div>
          <textarea id="notes-textarea" class="notes-textarea" style="display: none;" placeholder="Notizen eingeben..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { 
      signUp, signIn, signOut, getCurrentUser, onAuthStateChange 
    } from './members-auth.js';
    
    import { 
      getBookmarks, deleteBookmark, updateBookmark,
      getQuotes, deleteQuote, updateQuote
    } from './members-api.js';

    // ===== State =====
    let currentUser = null;
    let currentTab = 'bookmarks';
    let currentItems = [];
    let selectedItemId = null;
    let sortOrder = 'desc';
    let multiDeleteMode = false;
    let draggedElement = null;

    // ===== Init =====
    async function init() {
      setupAuthListeners();
      setupToolbarListeners();
      setupDragAndDrop();
      setupBackButton();
      
      const user = await getCurrentUser();
      if (user) {
        await showApp(user);
      } else {
        showAuth();
      }
    }

    // ===== Auth Functions =====
    function showAuth() {
      document.getElementById('auth-view').classList.add('active');
      document.getElementById('app-view').classList.remove('active');
    }

    async function showApp(user) {
      currentUser = user;
      document.getElementById('auth-view').classList.remove('active');
      document.getElementById('app-view').classList.add('active');
      document.getElementById('user-email').textContent = user.email;
      
      // Setup Back-Button nach dem Laden der App
      setupBackButton();
      
      await loadItems();
    }

    function setupAuthListeners() {
      document.getElementById('auth-switch-link').addEventListener('click', (e) => {
        e.preventDefault();
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const title = document.getElementById('auth-title');
        const switchText = document.getElementById('auth-switch-text');
        const switchLink = document.getElementById('auth-switch-link');
        
        if (loginForm.style.display !== 'none') {
          loginForm.style.display = 'none';
          registerForm.style.display = 'block';
          title.textContent = 'Registrierung';
          switchText.textContent = 'Bereits registriert?';
          switchLink.textContent = 'Jetzt anmelden';
        } else {
          loginForm.style.display = 'block';
          registerForm.style.display = 'none';
          title.textContent = 'Mitglieder Login';
          switchText.textContent = 'Noch kein Account?';
          switchLink.textContent = 'Jetzt registrieren';
        }
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        const result = await signIn(email, password);
        
        if (result.success) {
          await showApp(result.user);
        } else {
          showAuthMessage(result.message, 'error');
        }
      });

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        
        const result = await signUp(email, password, name);
        
        if (result.success) {
          showAuthMessage(result.message, 'success');
        } else {
          showAuthMessage(result.message, 'error');
        }
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await signOut();
        showAuth();
      });
    }

    function showAuthMessage(message, type) {
      const messageDiv = document.getElementById('auth-message');
      messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
    }

    // ===== Toolbar Functions =====
    function setupToolbarListeners() {
      // Tab switching
      document.querySelectorAll('.toolbar-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabName = tab.dataset.tab;
          if (tabName === 'bookmarks' || tabName === 'quotes') {
            switchTab(tabName);
          } else if (tabName === 'chat') {
            window.location.href = 'members.html#chat';
          }
        });
      });

      // Sort button
      document.getElementById('sort-btn').addEventListener('click', () => {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        loadItems();
      });

      // Delete button
      document.getElementById('delete-btn').addEventListener('click', () => {
        multiDeleteMode = !multiDeleteMode;
        selectedItemId = null;
        clearNotes();
        loadItems();
        updateDeleteButton();
      });
    }

    function switchTab(tabName) {
      currentTab = tabName;
      selectedItemId = null;
      
      document.querySelectorAll('.toolbar-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      
      loadItems();
      clearNotes();
    }

    // ===== Load Items =====
    async function loadItems() {
      const container = document.getElementById('items-list');
      container.innerHTML = '<div class="empty-state">Lade Daten...</div>';
      
      let result;
      if (currentTab === 'bookmarks') {
        result = await getBookmarks();
      } else {
        result = await getQuotes();
      }
      
      if (!result.success || result.data.length === 0) {
        container.innerHTML = '<div class="empty-state">Noch keine Einträge vorhanden</div>';
        currentItems = [];
        return;
      }
      
      // Sort by date
      currentItems = result.data.sort((a, b) => {
        const dateA = new Date(a.created_at);
        const dateB = new Date(b.created_at);
        return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
      });
      
      renderItems();
      updateKeywordFilter();
    }

    function renderItems() {
      const container = document.getElementById('items-list');
      
      if (currentItems.length === 0) {
        container.innerHTML = '<div class="empty-state">Noch keine Einträge vorhanden</div>';
        return;
      }
      
      container.innerHTML = currentItems.map((item, index) => {
        const isBookmark = currentTab === 'bookmarks';
        const gaNumber = isBookmark ? item.ga_number : item.ga_reference;
        const text = isBookmark ? item.paragraph_text : item.quote_text;
        const tags = item.tags || [];
        
        return `
          <div class="item-card ${selectedItemId === item.id ? 'selected' : ''} ${multiDeleteMode ? 'multi-delete' : ''}" 
               data-id="${item.id}" 
               data-index="${index}"
               draggable="${!multiDeleteMode}">
            ${multiDeleteMode ? `<input type="checkbox" class="item-checkbox" data-id="${item.id}" style="position: absolute; top: 1rem; right: 1rem;" onchange="updateDeleteButton()">` : ''}
            <div class="item-header">
              <a href="#" class="item-ga" data-ga="${gaNumber}" data-paragraph-id="${item.paragraph_id || ''}" style="color: var(--link-color); text-decoration: none; cursor: pointer;">
                ${gaNumber}
              </a>
              <span class="item-date">${new Date(item.created_at).toLocaleDateString('de-DE')}</span>
            </div>
            <div class="item-text">${isBookmark ? text : `"${text}"`}</div>
            ${tags.length > 0 ? `
              <div class="item-tags">
                ${tags.map(tag => `<span class="item-tag">#${tag}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      
      // Event-Delegation für GA-Links (funktioniert auch nach dynamischem Rendern)
      // Entferne alte Listener falls vorhanden
      container.removeEventListener('click', handleGALinkClick);
      container.addEventListener('click', handleGALinkClick);
      
      // Add click listeners für Item-Cards
      container.querySelectorAll('.item-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.type === 'checkbox' || e.target.classList.contains('item-ga')) return;
          const itemId = card.dataset.id;
          selectItem(itemId);
        });
      });
    }

    function selectItem(itemId) {
      selectedItemId = itemId;
      const item = currentItems.find(i => i.id === itemId);
      
      if (item) {
        document.querySelectorAll('.item-card').forEach(card => {
          card.classList.remove('selected');
        });
        document.querySelector(`[data-id="${itemId}"]`).classList.add('selected');
        
        // Show notes
        const textarea = document.getElementById('notes-textarea');
        const empty = document.getElementById('notes-empty');
        textarea.style.display = 'block';
        empty.style.display = 'none';
        textarea.value = item.note || (item.personal_note || '');
        
        // Save on blur
        textarea.onblur = () => saveNotes(itemId);
      }
    }

    function clearNotes() {
      document.getElementById('notes-textarea').style.display = 'none';
      document.getElementById('notes-empty').style.display = 'block';
      document.getElementById('notes-textarea').value = '';
    }

    async function saveNotes(itemId) {
      const note = document.getElementById('notes-textarea').value;
      const item = currentItems.find(i => i.id === itemId);
      
      if (!item) return;
      
      const isBookmark = currentTab === 'bookmarks';
      const updates = isBookmark ? { note } : { personal_note: note };
      
      if (isBookmark) {
        await updateBookmark(itemId, updates);
      } else {
        await updateQuote(itemId, updates);
      }
      
      // Update local data
      item.note = note;
      item.personal_note = note;
    }

    // ===== Drag and Drop =====
    function setupDragAndDrop() {
      let draggedElement = null;
      
      document.addEventListener('dragstart', (e) => {
        if (e.target.classList.contains('item-card')) {
          draggedElement = e.target;
          e.target.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        }
      });
      
      document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('item-card')) {
          e.target.classList.remove('dragging');
          draggedElement = null;
        }
      });
      
      document.addEventListener('dragover', (e) => {
        if (draggedElement) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          
          const afterElement = getDragAfterElement(e.target.closest('.items-list'), e.clientY);
          const list = e.target.closest('.items-list');
          
          if (afterElement == null) {
            list.appendChild(draggedElement);
          } else {
            list.insertBefore(draggedElement, afterElement);
          }
        }
      });
      
      document.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (draggedElement) {
          // Update order in database
          await updateItemOrder();
          draggedElement = null;
        }
      });
    }
    
    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.item-card:not(.dragging)')];
      
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }
    
    async function updateItemOrder() {
      const container = document.getElementById('items-list');
      const items = container.querySelectorAll('.item-card');
      const newOrder = Array.from(items).map((card, index) => ({
        id: card.dataset.id,
        order: index
      }));
      
      // Update updated_at to reflect new order (simple approach)
      // In a real implementation, you'd have an 'order' column in the database
      for (const item of newOrder) {
        const dbItem = currentItems.find(i => i.id === item.id);
        if (dbItem) {
          if (currentTab === 'bookmarks') {
            await updateBookmark(item.id, { updated_at: new Date().toISOString() });
          } else {
            await updateQuote(item.id, { updated_at: new Date().toISOString() });
          }
        }
      }
      
      // Reload to reflect new order
      await loadItems();
    }

    // ===== Navigation =====
    // Back-Button Funktion
    function setupBackButton() {
      const backButton = document.getElementById('back-to-app-btn');
      if (!backButton) return;
      
      // Zeige Button nur wenn window.opener vorhanden ist
      if (window.opener && !window.opener.closed) {
        backButton.style.display = 'flex';
        backButton.addEventListener('click', () => {
          try {
            // Versuche das opener-Fenster zu fokussieren
            if (window.opener && !window.opener.closed) {
              window.opener.focus();
              // Schließe dieses Fenster
              window.close();
            }
          } catch (err) {
            console.warn('[BACK-BUTTON] Fehler beim Zurückkehren:', err);
            // Falls window.close() nicht funktioniert, versuche trotzdem zu fokussieren
            try {
              window.opener.focus();
            } catch (e) {
              console.error('[BACK-BUTTON] Konnte Fenster nicht fokussieren:', e);
            }
          }
        });
      } else {
        backButton.style.display = 'none';
      }
    }
    
    // Event-Handler für GA-Link-Clicks (Event-Delegation)
    function handleGALinkClick(e) {
      const link = e.target.closest('.item-ga');
      if (!link) return;
      
      e.preventDefault();
      e.stopPropagation();
      
      console.log('[MEMBERS-CLICK] ========== LINK GEKLICKT ==========');
      const gaNumber = link.dataset.ga;
      const paragraphId = link.dataset.paragraphId || '';
      console.log('[MEMBERS-CLICK] GA-Nummer:', gaNumber);
      console.log('[MEMBERS-CLICK] Absatz-ID:', paragraphId);
      console.log('[MEMBERS-CLICK] window.opener:', !!window.opener);
      console.log('[MEMBERS-CLICK] saveMembersScrollPosition verfügbar:', typeof window.saveMembersScrollPosition);
      console.log('[MEMBERS-CLICK] navigateToLectureFromMembersPanel verfügbar:', typeof window.navigateToLectureFromMembersPanel);
      
      if (!gaNumber) {
        console.error('[MEMBERS-CLICK] Keine GA-Nummer gefunden!');
        return;
      }
      
      // WICHTIG: Fokussiere das opener-Fenster SOFORT beim Click (funktioniert besser bei direkter User-Interaktion)
      if (window.opener && !window.opener.closed) {
        try {
          console.log('[MEMBERS-CLICK] Versuche opener-Fenster zu fokussieren...');
          window.opener.focus();
          // Versuche auch über window-Objekt
          if (window.opener.window) {
            window.opener.window.focus();
          }
          console.log('[MEMBERS-CLICK] Opener-Fenster fokussiert');
        } catch (err) {
          console.warn('[MEMBERS-CLICK] Konnte opener-Fenster nicht fokussieren:', err);
        }
      }
      
      try {
        if (typeof window.saveMembersScrollPosition === 'function') {
          window.saveMembersScrollPosition();
        } else {
          console.warn('[MEMBERS-CLICK] saveMembersScrollPosition ist keine Funktion!');
        }
      } catch (err) {
        console.error('[MEMBERS-CLICK] Fehler bei saveMembersScrollPosition:', err);
      }
      
      if (typeof window.navigateToLectureFromMembersPanel === 'function') {
        console.log('[MEMBERS-CLICK] Rufe navigateToLectureFromMembersPanel auf...');
        
        // Rufe Navigation auf
        window.navigateToLectureFromMembersPanel(gaNumber, paragraphId);
        
        // Nach kurzer Verzögerung: Fokussiere opener-Fenster und schließe dieses Fenster
        setTimeout(() => {
          try {
            if (window.opener && !window.opener.closed) {
              console.log('[MEMBERS-CLICK] Fokussiere opener-Fenster und schließe members.html...');
              window.opener.focus();
              // Schließe dieses Fenster
              window.close();
            }
          } catch (err) {
            console.warn('[MEMBERS-CLICK] Fehler beim Zurückkehren:', err);
            // Falls window.close() nicht funktioniert, versuche trotzdem zu fokussieren
            try {
              if (window.opener && !window.opener.closed) {
                window.opener.focus();
              }
            } catch (e) {
              console.error('[MEMBERS-CLICK] Konnte Fenster nicht fokussieren:', e);
            }
          }
        }, 500); // Kurze Verzögerung, damit die Navigation starten kann
      } else {
        console.error('[MEMBERS-CLICK] navigateToLectureFromMembersPanel nicht verfügbar!');
        console.error('[MEMBERS-CLICK] Verfügbare window-Funktionen:', Object.keys(window).filter(k => k.includes('navigate') || k.includes('Lecture')));
      }
    }
    
    function saveMembersScrollPosition() {
      try {
        // Wenn wir in einem neuen Fenster sind, rufe die Funktion im opener-Fenster auf
        if (window.opener && !window.opener.closed && typeof window.opener.saveMembersScrollPosition === 'function') {
          window.opener.saveMembersScrollPosition();
        }
        // Falls direkt geöffnet, gibt es nichts zu speichern
      } catch (err) {
        console.warn('[MEMBERS-NAV] Fehler beim Speichern der Scroll-Position:', err);
        // Ignoriere Fehler - nicht kritisch
      }
    }
    window.saveMembersScrollPosition = saveMembersScrollPosition;

    function navigateToLectureFromMembersPanel(gaNumber, paragraphId) {
      console.log('[MEMBERS-NAV] ========== START ==========');
      console.log('[MEMBERS-NAV] Funktion aufgerufen!');
      console.log('[MEMBERS-NAV] GA-Nummer:', gaNumber);
      console.log('[MEMBERS-NAV] Absatz-ID:', paragraphId);
      console.log('[MEMBERS-NAV] window.opener vorhanden:', !!window.opener);
      console.log('[MEMBERS-NAV] window.opener geschlossen:', window.opener ? window.opener.closed : 'N/A');
      
      // Sicherstellen, dass die Funktion wirklich aufgerufen wird
      if (!gaNumber) {
        console.error('[MEMBERS-NAV] FEHLER: Keine GA-Nummer übergeben!');
        return;
      }
      
      // Prüfe ob wir in einem neuen Fenster sind (von app.html geöffnet)
      if (window.opener && !window.opener.closed) {
        console.log('[MEMBERS-NAV] Öffne im opener-Fenster');
        // Springe zurück zum ursprünglichen Fenster
        const openerWindow = window.opener;
        
        // Fokussiere das ursprüngliche Fenster - mehrfach versuchen
        try {
          // Prüfe ob Fenster minimiert ist
          if (openerWindow.document && openerWindow.document.hidden !== undefined) {
            console.log('[MEMBERS-NAV] Fenster versteckt:', openerWindow.document.hidden);
          }
          
          // Versuche verschiedene Methoden zum Fokussieren
          openerWindow.focus();
          
          // Versuche auch über postMessage zu kommunizieren (falls das Fenster es unterstützt)
          if (openerWindow.postMessage) {
            openerWindow.postMessage({ type: 'focus', source: 'members-panel' }, '*');
          }
          
          // Versuche auch window.focus() falls verfügbar
          if (openerWindow.window && openerWindow.window.focus) {
            openerWindow.window.focus();
          }
          
          // Versuche auch blur() auf dem aktuellen Fenster
          window.blur();
          openerWindow.focus();
          
          // Warte kurz und fokussiere nochmal
          setTimeout(() => {
            try {
              openerWindow.focus();
            } catch (e) {
              console.warn('[MEMBERS-NAV] Fokus-Retry fehlgeschlagen:', e);
            }
          }, 100);
          
          console.log('[MEMBERS-NAV] Opener-Fenster fokussiert');
        } catch (err) {
          console.warn('[MEMBERS-NAV] Konnte Fenster nicht fokussieren:', err);
        }
        
        // Prüfe ob showLecture verfügbar ist
        const hasShowLecture = typeof openerWindow.showLecture === 'function';
        console.log('[MEMBERS-NAV] showLecture verfügbar:', hasShowLecture);
        
        // Navigiere im ursprünglichen Fenster zum Vortrag
        if (hasShowLecture) {
          // Verwende showLecture Funktion direkt - das ist der beste Weg
          // showLecture scrollt automatisch zum Absatz, wenn targetIndex übergeben wird
          console.log('[MEMBERS-NAV] Rufe showLecture im opener-Fenster auf');
          console.log('[MEMBERS-NAV] Parameter:', gaNumber, paragraphId || null);
          
          try {
            // Rufe showLecture auf (ist async)
            const result = openerWindow.showLecture(gaNumber, paragraphId || null, []);
            console.log('[MEMBERS-NAV] showLecture aufgerufen, Ergebnis:', result);
            
            // Wenn es ein Promise ist, warte darauf und scrolle dann zum Absatz
            if (result && typeof result.then === 'function') {
              result.then(() => {
                console.log('[MEMBERS-NAV] showLecture abgeschlossen');
                
                // Nach dem Laden explizit zum Absatz scrollen
                if (paragraphId) {
                  // Fokussiere das Fenster nochmal nach dem Laden
                  try {
                    openerWindow.focus();
                  } catch (e) {
                    console.warn('[MEMBERS-NAV] Konnte Fenster nach Laden nicht fokussieren:', e);
                  }
                  
                  setTimeout(() => {
                    console.log('[MEMBERS-NAV] Scrolle zum Absatz:', paragraphId);
                    console.log('[MEMBERS-NAV] scrollToIndexInViewer verfügbar:', typeof openerWindow.scrollToIndexInViewer);
                    
                    // Versuche scrollToIndexInViewer zu verwenden
                    if (typeof openerWindow.scrollToIndexInViewer === 'function') {
                      console.log('[MEMBERS-NAV] Verwende scrollToIndexInViewer');
                      openerWindow.scrollToIndexInViewer(paragraphId);
                    } else {
                      console.log('[MEMBERS-NAV] scrollToIndexInViewer nicht verfügbar, verwende Fallback');
                      // Fallback: Direktes Scrollen zum Element
                      const cleanIndex = paragraphId.replace(/^\^/, '');
                      console.log('[MEMBERS-NAV] Suche Element: para-' + cleanIndex);
                      const paraElement = openerWindow.document.getElementById(`para-${cleanIndex}`);
                      if (paraElement) {
                        console.log('[MEMBERS-NAV] Element gefunden, scrolle...');
                        const mainContainer = openerWindow.document.getElementById('main');
                        if (mainContainer) {
                          const header = openerWindow.document.getElementById('viewer-header');
                          const headerHeight = header ? header.offsetHeight + 5 : 5;
                          const mainRect = mainContainer.getBoundingClientRect();
                          const paraRect = paraElement.getBoundingClientRect();
                          const relativeTop = paraRect.top - mainRect.top + mainContainer.scrollTop - headerHeight;
                          mainContainer.scrollTop = Math.max(0, relativeTop);
                          console.log('[MEMBERS-NAV] Gescrollt zu Position:', relativeTop);
                        } else {
                          console.log('[MEMBERS-NAV] main-Container nicht gefunden, verwende scrollIntoView');
                          paraElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                      } else {
                        console.warn('[MEMBERS-NAV] Absatz-Element nicht gefunden: para-' + cleanIndex);
                        // Versuche nochmal nach kurzer Verzögerung
                        setTimeout(() => {
                          const retryElement = openerWindow.document.getElementById(`para-${cleanIndex}`);
                          if (retryElement) {
                            console.log('[MEMBERS-NAV] Element bei Retry gefunden');
                            retryElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                          } else {
                            console.error('[MEMBERS-NAV] Element auch bei Retry nicht gefunden');
                          }
                        }, 500);
                      }
                    }
                  }, 1000); // Mehr Zeit für das Laden geben
                }
              }).catch(err => {
                console.error('[MEMBERS-NAV] Fehler in showLecture Promise:', err);
              });
            } else if (paragraphId) {
              // Falls showLecture kein Promise zurückgibt, warte trotzdem und scrolle
              setTimeout(() => {
                if (typeof openerWindow.scrollToIndexInViewer === 'function') {
                  openerWindow.scrollToIndexInViewer(paragraphId);
                }
              }, 1500);
            }
          } catch (err) {
            console.error('[MEMBERS-NAV] Fehler beim Aufruf von showLecture:', err);
            console.error('[MEMBERS-NAV] Stack:', err.stack);
            // Fallback: URL-basierte Navigation
            console.log('[MEMBERS-NAV] Fallback zu URL-Navigation');
            if (paragraphId) {
              openerWindow.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}&index=${encodeURIComponent(paragraphId)}`;
            } else {
              openerWindow.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}`;
            }
          }
        } else {
          // Fallback: URL-basierte Navigation
          console.log('[MEMBERS-NAV] showLecture nicht verfügbar, verwende URL-basierte Navigation');
          if (paragraphId) {
            openerWindow.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}&index=${encodeURIComponent(paragraphId)}`;
          } else {
            openerWindow.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}`;
          }
        }
      } else {
        // Normale Navigation (falls direkt geöffnet)
        console.log('[MEMBERS-NAV] Normale Navigation (kein opener oder opener geschlossen)');
        if (paragraphId) {
          window.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}&index=${encodeURIComponent(paragraphId)}`;
        } else {
          window.location.href = `app.html?ga=${encodeURIComponent(gaNumber)}`;
        }
      }
      console.log('[MEMBERS-NAV] ========== ENDE ==========');
    }
    window.navigateToLectureFromMembersPanel = navigateToLectureFromMembersPanel;

    // Alte Funktion für Rückwärtskompatibilität
    function navigateToLecture(gaNumber, paragraphId) {
      navigateToLectureFromMembersPanel(gaNumber, paragraphId);
    }
    window.navigateToLecture = navigateToLecture;

    // ===== Keyword Filter =====
    function updateKeywordFilter() {
      const select = document.getElementById('keyword-filter');
      const allKeywords = new Set();
      
      currentItems.forEach(item => {
        if (item.tags) {
          item.tags.forEach(tag => allKeywords.add(tag));
        }
      });
      
      const sortedKeywords = Array.from(allKeywords).sort();
      
      select.innerHTML = '<option value="">Schlagwörter</option>' +
        sortedKeywords.map(kw => `<option value="${kw}">${kw}</option>`).join('');
      
      select.addEventListener('change', (e) => {
        const keyword = e.target.value;
        filterByKeyword(keyword);
      });
    }

    function filterByKeyword(keyword) {
      if (!keyword) {
        renderItems();
        return;
      }
      
      const filtered = currentItems.filter(item => 
        item.tags && item.tags.includes(keyword)
      );
      
      const container = document.getElementById('items-list');
      container.innerHTML = filtered.map((item, index) => {
        // Same rendering as renderItems but with filtered data
        const isBookmark = currentTab === 'bookmarks';
        const gaNumber = isBookmark ? item.ga_number : item.ga_reference;
        const text = isBookmark ? item.paragraph_text : item.quote_text;
        const tags = item.tags || [];
        
        return `
          <div class="item-card ${selectedItemId === item.id ? 'selected' : ''}" 
               data-id="${item.id}" 
               data-index="${index}">
            <div class="item-header">
              <a href="#" class="item-ga" data-ga="${gaNumber}" data-paragraph-id="${item.paragraph_id || ''}" style="color: var(--link-color); text-decoration: none; cursor: pointer;">
                ${gaNumber}
              </a>
              <span class="item-date">${new Date(item.created_at).toLocaleDateString('de-DE')}</span>
            </div>
            <div class="item-text">${isBookmark ? text : `"${text}"`}</div>
            ${tags.length > 0 ? `
              <div class="item-tags">
                ${tags.map(tag => `<span class="item-tag">#${tag}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      
      // Event-Delegation funktioniert auch für gefilterte Items (keine zusätzlichen Listener nötig)
    }

    // ===== Multi-Delete =====
    function updateDeleteButton() {
      const checkboxes = document.querySelectorAll('.item-checkbox:checked');
      const deleteBtn = document.getElementById('delete-btn');
      
      if (multiDeleteMode && checkboxes.length > 0) {
        deleteBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
          ${checkboxes.length} löschen
        `;
        deleteBtn.onclick = deleteSelectedItems;
      } else {
        deleteBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        `;
        deleteBtn.onclick = () => {
          multiDeleteMode = !multiDeleteMode;
          selectedItemId = null;
          clearNotes();
          loadItems();
          updateDeleteButton();
        };
      }
    }
    window.updateDeleteButton = updateDeleteButton;
    
    async function deleteSelectedItems() {
      const checkboxes = document.querySelectorAll('.item-checkbox:checked');
      if (checkboxes.length === 0) return;
      
      if (!confirm(`Wirklich ${checkboxes.length} ${currentTab === 'bookmarks' ? 'Bookmark(s)' : 'Zitat(e)'} löschen?`)) {
        return;
      }
      
      const ids = Array.from(checkboxes).map(cb => cb.dataset.id);
      
      for (const id of ids) {
        if (currentTab === 'bookmarks') {
          await deleteBookmark(id);
        } else {
          await deleteQuote(id);
        }
      }
      
      multiDeleteMode = false;
      selectedItemId = null;
      clearNotes();
      await loadItems();
      updateDeleteButton();
    }

    // ===== Start =====
    init();
  </script>
