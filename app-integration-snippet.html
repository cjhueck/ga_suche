<script src="members-integration-standalone.js"></script>

<!-- Header Icons -->
<script src="members-header-icons.js"></script>

<!-- Aktivierung -->
<script>
  document.addEventListener('DOMContentLoaded', async function() {
    
    // TODO: Diese Werte aus Ihrer App-Logik holen!
    // Beispiel 1: Aus DOM holen
    const titleElement = document.querySelector('h1');
    const titleText = titleElement ? titleElement.textContent : '';
    const gaMatch = titleText.match(/GA\s?(\d+)\/(\d+)/);
    const gaNumber = gaMatch ? `GA${gaMatch[1]}/${gaMatch[2]}` : 'GA110/5';
    
    // Beispiel 2: Aus URL-Parameter
    // const urlParams = new URLSearchParams(window.location.search);
    // const gaNumber = urlParams.get('ga') || 'GA110/5';
    
    // Beispiel 3: Aus globaler Variable
    // const gaNumber = window.currentLecture?.ga || 'GA110/5';
    
    // Header Icons aktivieren
    try {
      await window.initMemberHeaderIcons(gaNumber, titleText);
      console.log('✓ Member Icons aktiviert für:', gaNumber);
    } catch (error) {
      console.error('Fehler bei Icon-Aktivierung:', error);
    }
  });
</script>
